name: macOS native configuration check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-arm64:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps
      - name: Download pinned Apple Silicon native bundle
        run: npm run components:install -- darwin-arm64
      - name: Verify native architecture and dependencies
        run: |
          test "$(uname -m)" = arm64
          file resources/wcdb/macos/universal/*.dylib resources/wedecrypt/macos/arm64/*.node
          otool -L resources/wcdb/macos/universal/libwcdb_api.dylib
          codesign --verify --strict resources/wcdb/macos/universal/libwcdb_api.dylib
      - name: Check types and build desktop application
        run: |
          npm version "5.0.0-macos-preview.${{ github.run_number }}" --no-git-tag-version --ignore-scripts
          npm run typecheck
          node scripts/clean-dist-electron.cjs
          npx vite build
      - name: Install PDF verification tool
        run: python3 -m pip install --break-system-packages pypdf
      - name: Check native runtime and application export
        run: |
          npm run components:test:shared
          npm run components:test:macos
      - name: Package Apple Silicon application
        run: npx electron-builder --mac dmg zip --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify packaged native resources
        run: |
          node scripts/check-packaged-macos.cjs
          codesign --verify --deep --strict release/mac-arm64/WeFlow.app
      - name: Save verified Mac installers
        uses: actions/upload-artifact@v4
        with:
          name: WeFlow-macOS-arm64-installers
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error
          retention-days: 14
