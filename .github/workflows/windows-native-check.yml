name: Windows native configuration check

on:
  push:
    branches: ['components/pinned-installer']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps
      - name: Download pinned native bundle
        run: npm run components:install -- win32-x64
      - name: Check native runtime with synthetic inputs
        run: |
          npm run components:test
          npm run components:test:windows
      - name: Check types and build desktop application
        run: |
          npm version "5.0.0-wcdb-compat.${{ github.run_number }}" --no-git-tag-version --ignore-scripts
          npm run typecheck
          node scripts/clean-dist-electron.cjs
          npx vite build
      - name: Package Windows x64 installer
        run: npx electron-builder --win nsis --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Save test installer
        uses: actions/upload-artifact@v4
        with:
          name: WeFlow-Windows-x64-compat-installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14

  publish-windows-prerelease:
    needs: windows-x64
    if: github.repository == 'TuSiV/WeFlow'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: WeFlow-Windows-x64-compat-installer
          path: release
      - name: Publish verified Windows installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: windows-wcdb-compat-${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          cd release
          sha256sum -- *.exe > SHA256SUMS.txt
          gh release create "$RELEASE_TAG" ./*.exe SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Windows x64 WCDB compatibility build" \
            --notes-file ../docs/windows-compat-release-notes.md --prerelease
