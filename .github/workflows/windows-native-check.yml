name: Windows native configuration check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps
      - name: Download pinned native bundle
        run: npm run components:install -- win32-x64
      - name: Check types and build desktop application
        run: |
          npm version "5.0.0-wcdb-compat.${{ github.run_number }}" --no-git-tag-version --ignore-scripts
          npm run typecheck
          node scripts/clean-dist-electron.cjs
          npx vite build
      - name: Install PDF verification tool
        run: python -m pip install pypdf
      - name: Check native runtime and application export
        run: |
          npm run components:test
          npm run components:test:windows
      - name: Package Windows x64 installer
        run: npx electron-builder --win nsis --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Save test installer
        uses: actions/upload-artifact@v4
        with:
          name: WeFlow-Windows-x64-compat-installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
